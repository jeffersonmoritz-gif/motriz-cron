name: monitor
# Reserva manual. O agendamento de 15 em 15 minutos roda no Cloudflare Workers (motriz-cron),
# porque o GitHub não disparava o cron deste repositório de forma confiável.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checar sites
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -m 90 -X POST https://motriztech.vercel.app/api/monitor/run -H "Authorization: Bearer $MONITOR_SECRET")
          echo "HTTP $code"; head -c 600 out.json; echo
          test "$code" = "200"
